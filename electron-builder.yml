appId: com.fastytx.chatlogviewer
productName: ChatLogViewer
copyright: Copyright © 2026 fast-ytx

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**

extraResources:
  - from: build/icon.ico
    to: icon.ico

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 猿通讯聊天记录查看器
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

npmRebuild: true
